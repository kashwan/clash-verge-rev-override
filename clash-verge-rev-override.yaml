# ============================================================
# Clash Verge Rev 全局覆写配置（Merge）
# 用途：防 DNS 泄露 + 国内外分流
# 用法：订阅页 -> 全局扩展配置 -> Merge，粘贴本文件全部内容
# 重要：先在「设置 -> Clash 设置」里关闭当前订阅的「DNS 覆写」，
#       并在「IPv6」一项关闭 IPv6；否则 DNS 相关字段会被应用设置接管并丢弃。
# 说明：本文件为全局覆写，会整体替换订阅自带的 proxy-groups 和 rules
#       节点仍通过 include-all 自动吸收，不需要手动维护
# ============================================================

# 注意：顶层 ipv6 由应用设置接管，这里不写；请在「设置 -> IPv6」里关闭

# ---------- 2. DNS：国内直查、国外走代理，杜绝泄露 ----------
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  # 需要真实 IP 的域名（局域网、NTP、系统探测、国内站）
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "pool.ntp.org"
    - "+.push.apple.com"
    - "mesu.apple.com"
    - "swscan.apple.com"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
    - "connectivitycheck.android.com"
    - "www.msftconnecttest.com"
    - "www.msftncsi.com"
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
  # 仅用于解析下面 DoH 域名本身，必须是 IP，不能走代理
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 解析机场节点域名，必须直连，否则死循环
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 直连流量用国内 DNS
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 国内域名走国内 DNS（配合 fake-ip-filter，结果更准）
  nameserver-policy:
    "rule-set:cn_domain,private_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  # 其余域名全部通过代理查询，运营商看不到你的 DNS 请求
  nameserver:
    - "https://8.8.8.8/dns-query#🛰 自选节点"
    - "https://1.1.1.1/dns-query#🛰 自选节点"

# ---------- 3. 域名嗅探：从 TLS SNI 还原真实域名，提升分流准确率 ----------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"

# ---------- 4. 规则集 ----------
rule-providers:
  private_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/private.mrs"
  cn_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/cn.mrs"
  ads_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ads-all.mrs"
  ai_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ai-!cn.mrs"
  youtube_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/youtube.mrs"
  netflix_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/netflix.mrs"
  tiktok_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/tiktok.mrs"
  telegram_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/telegram.mrs"
  private_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/private.mrs"
  cn_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/cn.mrs"
  telegram_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/telegram.mrs"
  netflix_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: 🛰 自选节点
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/netflix.mrs"

# ---------- 5. 策略组（整体替换；include-all 自动吸收订阅所有节点） ----------
proxy-groups:
  - name: ⚡ 自动选择
    type: url-test
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    tolerance: 50
    lazy: true
    max-failed-times: 3
    expected-status: 204
  - name: 🛰 自选节点
    type: select
    include-all: true
    proxies: [⚡ 自动选择, DIRECT]
  - name: 🤖 AI 分流
    type: select
    include-all: true
    proxies: [🛰 自选节点]
  - name: 🎬 流媒体
    type: select
    include-all: true
    proxies: [🛰 自选节点]
  - name: 📲 电报
    type: select
    include-all: true
    proxies: [🛰 自选节点]
  - name: 🛑 广告
    type: select
    proxies: [REJECT, DIRECT]

# ---------- 6. 分流规则（整体替换） ----------
rules:
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,ads_domain,🛑 广告
  - RULE-SET,ai_domain,🤖 AI 分流
  - RULE-SET,youtube_domain,🎬 流媒体
  - RULE-SET,netflix_domain,🎬 流媒体
  - RULE-SET,tiktok_domain,🎬 流媒体
  - RULE-SET,telegram_domain,📲 电报
  - RULE-SET,telegram_ip,📲 电报,no-resolve
  - RULE-SET,netflix_ip,🎬 流媒体,no-resolve
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT,no-resolve
  - MATCH,🛰 自选节点
